<!DOCTYPE html>
<!-- YOLO - Copyright (c) 2026 PlinkBit. All rights reserved. See LICENSE. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="PlinkBit">
    <!-- No pinch or double-tap zoom; draw under notches (the CSS pads for them) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <!-- Home-screen install (iOS and Android): runs fullscreen from an icon -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YOLO">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <title>YOLO - Tanks. Maze. Mayhem.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Touch controls: shown once a finger touches the screen (js/touch.js) -->
    <div id="touch-ui" aria-hidden="true">
        <div class="stick" id="stick-move"><div class="stick-knob"></div></div>
        <div class="stick" id="stick-aim"><div class="stick-knob"></div></div>
        <div class="stick-hint" id="hint-move">DRIVE</div>
        <div class="stick-hint" id="hint-aim">AIM + FIRE</div>
        <button type="button" class="touch-btn" id="btn-shell">SHELL<span id="shell-count"></span></button>
        <button type="button" class="touch-btn" id="btn-pause">II</button>
    </div>

    <div id="rotate-overlay">
        <div class="rotate-icon"></div>
        <p>Rotate your device</p>
    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
